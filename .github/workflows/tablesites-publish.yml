# TableSites 自助发布 —— 交付时复制到客户项目 repo 的 .github/workflows/tablesites-publish.yml
# 顾客在网站点「发布上线」→ feedback-api 触发本 workflow → 烧录草稿进源码 → git push
# → 平台(Vercel / GitHub Pages / Cloudflare Pages)的 Git 集成自动部署。平台无关。
#
# 前置(每个 repo 配一次 secrets):
#   CF_ACCOUNT_ID  —— Cloudflare 账号 ID
#   CF_D1_TOKEN    —— Cloudflare API Token(有 D1 读权限)
# 并把发布工具 .tablesites/(engine.mjs + run.mjs)一并放进 repo。
name: TableSites Publish

on:
  repository_dispatch:
    types: [tablesites-publish]
  workflow_dispatch: {}        # 也允许在 Actions 页手动触发(测试用)

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # 允许 Action 提交+推送
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 装依赖(烧录引擎需要 cheerio)
        run: npm i --no-save cheerio

      - name: 烧录草稿进源码
        run: node .tablesites/run.mjs "${{ github.event.client_payload.client_id || vars.TABLESITES_CLIENT_ID }}" .
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_D1_TOKEN }}

      - name: 提交并推送(触发平台自动部署)
        run: |
          git config user.name "TableSites Bot"
          git config user.email "bot@tablesites.com"
          git add -A
          if git diff --cached --quiet; then
            echo "没有内容改动,跳过"
            exit 0
          fi
          git commit -m "content: 顾客自助内容更新 [skip ci]"
          git push
